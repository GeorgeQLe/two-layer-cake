name: Feature Request
description: Suggest a new feature for two-layer-cake
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe your ideal solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Other approaches you've considered
  - type: dropdown
    id: package
    attributes:
      label: Affected Package
      options:
        - two-layer-cake (core)
        - '@two-layer-cake/adapter-claude'
        - '@two-layer-cake/adapter-openai'
        - All packages
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Code examples, links, or mockups
